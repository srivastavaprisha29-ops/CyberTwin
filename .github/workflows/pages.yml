name: Deploy CyberTwin to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Test risk model
        run: node --test risk-model.test.mjs
      - name: Stage the demo
        run: |
          mkdir -p _site
          cp land.html _site/index.html
          cp styles.css demo.js risk-model.mjs media-lab.js _site/
      - name: Install browser test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install playwright==1.62.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test the staged site in Chromium
        run: .venv/bin/python tests/browser_smoke.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
